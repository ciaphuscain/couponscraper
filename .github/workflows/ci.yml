name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -t . -v
      - name: Extension unit tests
        run: node --test tests/extension/lib.test.js
      - name: Windows one-command setup script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:COUPONHUNTER_HOME = "$env:RUNNER_TEMP\chsetup"
          .\scripts\setup.ps1 -Demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\scripts\setup.ps1          # re-run: must be idempotent
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\couponhunter.exe evaluate B0DEMO0001
          .\.venv\Scripts\couponhunter.exe doctor --offline
      - name: Windows logon task (-AutoStart) starts the server
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\setup.ps1 -AutoStart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ScheduledTask -TaskName CouponHunter | Format-List TaskName, State
          $ok = $false
          foreach ($i in 1..30) {
            try { if ((Invoke-RestMethod http://127.0.0.1:8765/healthz -TimeoutSec 2).ok) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
          Get-ScheduledTask -TaskName CouponHunter | Get-ScheduledTaskInfo | Format-List LastRunTime, LastTaskResult
          .\scripts\setup.ps1 -AutoStart     # re-run must leave the task alone
          Stop-ScheduledTask -TaskName CouponHunter
          Unregister-ScheduledTask -TaskName CouponHunter -Confirm:$false
          if (-not $ok) { Write-Error "server started by the logon task never answered /healthz"; exit 1 }
      - name: CLI smoke test
        shell: bash
        run: |
          export COUPONHUNTER_HOME="$RUNNER_TEMP/chhome"
          python -m couponhunter init --demo
          python -m couponhunter evaluate B0DEMO0001
          python -m couponhunter alerts --dry-run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium (test-only dependency)
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Extension end-to-end test
        run: node tests/extension/e2e.js
