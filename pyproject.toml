[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couponhunter"
version = "0.1.0"
description = "Personal Amazon India savings intelligence engine (local, single-user)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only, by design (see docs/adr/ADR-003)
license = { text = "MIT" }

[project.scripts]
couponhunter = "couponhunter.cli:main"

[tool.setuptools.packages.find]
include = ["couponhunter*"]

[tool.setuptools.package-data]
couponhunter = ["migrations/*.sql", "web/static/*.css"]
