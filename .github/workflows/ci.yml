name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s tests -t . -v
      - name: Extension unit tests
        run: node --test tests/extension/lib.test.js
      - name: Windows one-command setup script
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:COUPONHUNTER_HOME = "$env:RUNNER_TEMP\chsetup"
          .\scripts\setup.ps1 -Demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\scripts\setup.ps1          # re-run: must be idempotent
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\couponhunter.exe evaluate B0DEMO0001
          .\.venv\Scripts\couponhunter.exe doctor --offline
      - name: Windows logon task (-AutoStart) starts, migrates and survives re-runs
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          function Wait-Healthy { foreach ($i in 1..30) { try { if ((Invoke-RestMethod http://127.0.0.1:8765/healthz -TimeoutSec 2).ok) { return $true } } catch { }; Start-Sleep -Seconds 1 }; return $false }
          # 1. A task as registered by older versions of setup.ps1 (pip's couponhunter.exe launcher).
          $legacy = New-ScheduledTaskAction -Execute (Resolve-Path .\.venv\Scripts\couponhunter.exe).Path -Argument "serve" -WorkingDirectory (Get-Location).Path
          Register-ScheduledTask -TaskName CouponHunter -Action $legacy -Trigger (New-ScheduledTaskTrigger -AtLogOn -User $env:USERNAME) | Out-Null
          Start-ScheduledTask -TaskName CouponHunter
          if (-not (Wait-Healthy)) { Write-Error "legacy task never served"; exit 1 }
          # 2. Setup must migrate it while it runs, clear the old server and come back healthy.
          .\scripts\setup.ps1 -AutoStart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $t = Get-ScheduledTask -TaskName CouponHunter
          $t.Actions[0] | Format-List Execute, Arguments
          $t.Settings | Format-List DisallowStartIfOnBatteries, StopIfGoingOnBatteries
          if ($t.Actions[0].Execute -notlike "*python.exe") { Write-Error "task not migrated to python.exe"; exit 1 }
          if ($t.Settings.DisallowStartIfOnBatteries -or $t.Settings.StopIfGoingOnBatteries) { Write-Error "battery settings wrong"; exit 1 }
          if (-not (Wait-Healthy)) { Write-Error "server not healthy after migration"; exit 1 }
          # 3. Re-run while running (the 'git pull, then setup again' case).
          .\scripts\setup.ps1 -AutoStart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Wait-Healthy)) { Write-Error "server not healthy after re-run"; exit 1 }
          Get-ScheduledTask -TaskName CouponHunter | Get-ScheduledTaskInfo | Format-List LastRunTime, LastTaskResult
          Stop-ScheduledTask -TaskName CouponHunter
          Unregister-ScheduledTask -TaskName CouponHunter -Confirm:$false
      - name: CLI smoke test
        shell: bash
        run: |
          export COUPONHUNTER_HOME="$RUNNER_TEMP/chhome"
          python -m couponhunter init --demo
          python -m couponhunter evaluate B0DEMO0001
          python -m couponhunter alerts --dry-run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium (test-only dependency)
        run: |
          npm install --no-save playwright@1.50.1
          npx playwright install --with-deps chromium
      - name: Extension end-to-end test
        run: node tests/extension/e2e.js
